<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Formiche Golose</title>
<meta name="description" content="Puzzle in pixel art: libera le formiche giuste e fagli divorare il cibo, un colore alla volta.">
<meta name="theme-color" content="#f6e7cf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Formiche">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone/icona-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<style>
  :root {
    --sfondo: #f6e7cf;
    --tovaglia: #e9503f;
    --carta: #fffaf1;
    --inchiostro: #3b2a20;
    --tenue: #8a7262;
    --verde: #3f9b4b;
    --ombra: 0 4px 0 rgba(59, 42, 32, 0.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      repeating-linear-gradient(0deg, rgba(233, 80, 63, 0.10) 0 22px, transparent 22px 44px),
      repeating-linear-gradient(90deg, rgba(233, 80, 63, 0.10) 0 22px, transparent 22px 44px),
      var(--sfondo);
    color: var(--inchiostro);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .schermo {
    position: fixed; inset: 0; display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .schermo.attivo { display: flex; }
  button {
    font: inherit; color: inherit; border: 0; cursor: pointer;
    background: var(--carta); border-radius: 14px; box-shadow: var(--ombra);
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(59, 42, 32, 0.25); }

  /* Home */
  #home { align-items: center; justify-content: center; gap: 18px; text-align: center; padding-inline: 16px; }
  #home h1 { font-size: clamp(34px, 10vw, 54px); margin: 0; line-height: 1; letter-spacing: -0.5px; }
  #home h1 span { color: var(--tovaglia); }
  #home p { margin: 0; color: var(--tenue); max-width: 320px; }
  #logo { width: 150px; height: 150px; image-rendering: pixelated; }
  .grande { font-size: 22px; font-weight: 800; padding: 16px 44px; background: var(--verde); color: #fff; }
  .medio { font-size: 17px; font-weight: 700; padding: 12px 28px; }
  #suono { font-size: 15px; padding: 9px 18px; }

  /* Barra in alto */
  .barra { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .barra h2 { flex: 1; margin: 0; font-size: 18px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icona { width: 44px; height: 44px; font-size: 22px; display: grid; place-items: center; padding: 0; flex: none; }

  /* Elenco livelli */
  #griglia { flex: 1; overflow-y: auto; padding: 4px 16px 24px; -webkit-overflow-scrolling: touch; }
  #griglia h3 { margin: 18px 4px 10px; font-size: 15px; color: var(--tenue); text-transform: uppercase; letter-spacing: 1px; }
  .righe { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
  .carta { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; }
  .carta canvas { width: 70%; height: 70%; image-rendering: pixelated; object-fit: contain; }
  .carta b { font-size: 13px; color: var(--tenue); }
  .carta.fatto::after {
    content: "✓"; position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--verde); color: #fff; font-weight: 900; font-size: 14px; display: grid; place-items: center;
  }

  /* Partita */
  #tela { flex: 1; width: 100%; display: block; touch-action: none; }
  .velo {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(59, 42, 32, 0.45); padding: 16px; z-index: 5;
  }
  .velo.attivo { display: flex; }
  .finestra {
    background: var(--carta); border-radius: 22px; padding: 24px 22px; width: min(340px, 100%);
    text-align: center; box-shadow: 0 8px 0 rgba(59, 42, 32, 0.3); animation: entra 0.25s ease-out;
  }
  .finestra h2 { margin: 0 0 6px; font-size: 26px; }
  .finestra p { margin: 0 0 16px; color: var(--tenue); }
  .finestra canvas { width: 120px; height: 120px; image-rendering: pixelated; margin-bottom: 8px; }
  .finestra .pulsanti { display: flex; flex-direction: column; gap: 10px; }
  @keyframes entra { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>

<section id="home" class="schermo attivo">
  <canvas id="logo" width="16" height="16"></canvas>
  <h1>Formiche<br><span>Golose</span></h1>
  <p>Tocca uno sciame: le formiche di quel colore divorano il cibo dello stesso colore.</p>
  <button class="grande" id="gioca">Gioca</button>
  <button class="medio" id="apriLivelli">Livelli</button>
  <button id="suono">Suono: sì</button>
</section>

<section id="livelli" class="schermo">
  <div class="barra">
    <button class="icona" data-vai="home" aria-label="Indietro">←</button>
    <h2>Livelli</h2>
    <span class="icona" style="visibility:hidden"></span>
  </div>
  <div id="griglia"></div>
</section>

<section id="partita" class="schermo">
  <div class="barra">
    <button class="icona" data-vai="livelli" aria-label="Livelli">←</button>
    <h2 id="titolo"></h2>
    <button class="icona" id="annulla" aria-label="Annulla mossa">↶</button>
    <button class="icona" id="ricomincia" aria-label="Ricomincia">⟳</button>
  </div>
  <canvas id="tela"></canvas>
</section>

<div class="velo" id="veloVinto">
  <div class="finestra">
    <canvas id="premio"></canvas>
    <h2>Buonissimo!</h2>
    <p id="testoVinto"></p>
    <div class="pulsanti">
      <button class="grande" id="prossimo">Prossimo livello</button>
      <button class="medio" data-vai="livelli">Livelli</button>
    </div>
  </div>
</div>

<div class="velo" id="veloPerso">
  <div class="finestra">
    <h2>Posti pieni!</h2>
    <p>Non c'è più spazio per far aspettare le formiche.</p>
    <div class="pulsanti">
      <button class="grande" id="annullaPerso">Annulla l'ultima mossa</button>
      <button class="medio" id="riprova">Ricomincia il livello</button>
    </div>
  </div>
</div>

<script src="js/sprites.js"></script>
<script src="js/motore.js"></script>
<script src="js/gioco.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
